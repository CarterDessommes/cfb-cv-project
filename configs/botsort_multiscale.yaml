# BoT-SORT config for the multi-resolution (merged-detection) path.
# Same as botsort.yaml but with Re-ID disabled: native-feature Re-ID is only
# available on Ultralytics' .track() path, and the merged path drives the
# tracker manually with no native feats. Association relies on motion + IoU +
# GMC (sparseOptFlow), which handles broadcast camera motion well.

tracker_type: botsort

# Detection thresholds
track_high_thresh: 0.5      # Threshold for high confidence detections
track_low_thresh: 0.1       # Threshold for low confidence (second association)
new_track_thresh: 0.6       # Threshold for initializing new tracks

# Track management
track_buffer: 60            # Frames to keep lost tracks (longer occlusions)
match_thresh: 0.8           # IoU matching threshold
fuse_score: true            # Fuse detection score with motion/IoU for matching

# Global Motion Compensation
gmc_method: sparseOptFlow   # Options: sparseOptFlow, orb, sift, ecc, none

# Re-ID settings — disabled on the merged path (no native feats available)
proximity_thresh: 0.5       # Spatial matching threshold
appearance_thresh: 0.25     # Re-ID embedding similarity threshold
with_reid: false            # DISABLED for the manual/merged path
model: auto
